# 酉润关务计算器 - Android APK 构建
# 当推送到 main 分支时自动构建 Android APK

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli@6 @capacitor/core@6

      - name: Initialize Capacitor Project
        run: |
          npm init -y
          npx cap init "酉润关务计算器" "com.yourun.calculator" --web-dir=.

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Web Assets
        run: |
          npx cap copy
          npx cap sync

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
        timeout-minutes: 15

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 酉润关务计算器-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
